<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pendaftaran Klub Coding Tunas Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-6">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">Pendaftaran DevClub 
2026</h2>
        <p class="text-sm text-slate-600 mb-6 text-center">SMK Tunas Media - Konsentrasi 
Keahlian RPL</p>
        <form id="formDaftar" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">NIS 
Siswa</label>
                <input type="text" id="nis" class="w-full border rounded px-3 py-2 text-sm 
focus:outline-blue-500" placeholder="Contoh: 20261012" required>
                <span id="errNis" class="text-xs text-red-500 hidden">NIS harus berupa 8 digit 
angka!</span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nama 
Lengkap</label>
                <input type="text" id="nama" class="w-full border rounded px-3 py-2 text-sm 
focus:outline-blue-500" placeholder="Masukkan nama lengkap" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Divisi 
Minat</label>
                <select id="divisi" class="w-full border rounded px-3 py-2 text-sm 
focus:outline-blue-500" required>
                    <option value="">-- Pilih Divisi --</option>
                    <option value="Web Development">Web Development (PHP/Tailwind)</option>
                    <option value="Mobile App">Mobile App Development (Flutter)</option>
                    <option value="Data Science">Data Science & AI (Python)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email 
Active</label>
                <input type="email" id="email" class="w-full border rounded px-3 py-2 text-sm 
focus:outline-blue-500" placeholder="nama@email.com" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font
bold py-2 rounded text-sm transition">KIRIM PENDAFTARAN</button>
        </form>
        <div id="responseMessage" class="mt-4 p-3 rounded text-sm font-semibold hidden text
center"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
